plugins {
    id 'com.android.application'
}

android {
    namespace 'com.loopcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.loopcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // BUG FIX 6: signingConfigs.debug must be declared before buildTypes that reference it.
    // Using the built-in debug signing config (already defined by AGP) — no need to redeclare.
    buildTypes {
        debug {
            // applicationIdSuffix removed: release and debug share the same ID so the
            // foreground service and boot receiver work the same way in both builds.
        }
        release {
            minifyEnabled false
            // Sign release with the debug keystore so it installs without a custom keystore.
            // AGP always defines signingConfigs.debug, so this is safe here.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-video:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
}
